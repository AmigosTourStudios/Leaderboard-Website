
<!DOCTYPE html>
<html lang="de">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Amigos Challenge Cup 2026</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


    <!-- =====================================
         HEADER
         ===================================== -->

         <!-- =====================================
         LOGO links
         ===================================== -->

    <header class="header">

        <div class="tour-brand">

            <img
                src="Tour_Logo.png"
                alt="Amigos Tour"
            >

        </div>

        <!-- =====================================
         TURNIERTITEL mitte
         ===================================== -->

        <div class="tournament-brand">

            <div class="tournament-eyebrow">
                AMIGOS TOUR
            </div>

            <div class="tournament-title">
                ST. EURACH OPEN
            </div>

            <div
                class="tournament-year"
                id="tournament-year"
            >
                03.08. - 06.08 | 2026
            </div>

        </div>

        <!-- =====================================
         LOCATION rechts
         ===================================== -->

        <div class="location">

            <span class="location-label">
                GERMANY
            </span>

            <span class="location-value">
                IFFELDORF
            </span>

        </div>

    </header>



    <!-- =====================================
         NAVIGATION
         ===================================== -->

    <nav class="navigation">

        <button
            class="nav-button active"
            id="nav-leaderboard"
            type="button"
        >
            LEADERBOARD
        </button>


        <button
            class="nav-button"
            id="nav-results"
            type="button"
        >
            RESULTS
        </button>


        <button
            class="nav-button"
            id="nav-news"
            type="button"
        >
            NEWS
        </button>

    </nav>



    <!-- =====================================
         LEADERBOARD
         ===================================== -->

    <section
        class="page-section"
        id="leaderboard-section"
    >

        <section class="section-header">

            <div class="live">
                LIVE
            </div>


            <div class="section-title">
                LEADERBOARD
            </div>


            <div
                class="round"
                id="round-info"
            >
                TURNIER WIRD GELADEN
            </div>

        </section>


        <main
            class="leaderboard"
            id="leaderboard"
        >

        </main>

    </section>



    <!-- =====================================
         RESULTS
         ===================================== -->

    <section
        class="page-section hidden"
        id="results-section"
    >

        <section class="section-header">

            <div class="live">
                RESULTS
            </div>


            <div class="section-title">
                SCORECARD
            </div>


            <div class="results-round-select">

                <select
                    id="results-round"
                    class="results-select"
                >

                </select>

            </div>

        </section>



        <div
            class="results-course"
            id="results-course"
        >
            TURNIER WIRD GELADEN
        </div>



        <main
            class="results-container"
            id="results-container"
        >

        </main>

    </section>



    <!-- =====================================
         NEWS
         ===================================== -->

    <section
        class="page-section hidden"
        id="news-section"
    >

        <section class="section-header">

            <div class="live">
                NEWS
            </div>


            <div class="section-title">
                NEWS
            </div>


            <div class="round">
                AMIGOS CHALLENGE CUP 2026
            </div>

        </section>


        <main
            class="news-container"
            id="news-container"
        >

        </main>

    </section>



    <!-- =====================================
         SUPABASE
         ===================================== -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


    <!-- =====================================
         APPLICATION
         ===================================== -->

    <script src="script.js"></script>


</body>

</html>
